<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پی پی پی ڈیجیٹل سہراب گوٹھ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        :root { --red: #d32f2f; --black: #000000; --green: #2e7d32; }
        body { font-family: 'Segoe UI', Tahoma, Arial; background: #f0f2f5; margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: auto; }
        .header { background: linear-gradient(to right, var(--red), var(--black), var(--green)); color: white; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 15px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 5px solid var(--red); }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        .sig-area { border: 2px dashed #ccc; background: #fafafa; border-radius: 10px; margin: 10px 0; }
        canvas { width: 100%; height: 120px; cursor: crosshair; }
        .btn-submit { background: var(--red); color: white; border: none; padding: 15px; width: 100%; border-radius: 50px; font-weight: bold; font-size: 18px; cursor: pointer; }
        #idCard { display: none; margin-top: 20px; border: 2px solid #000; border-radius: 15px; background: white; overflow: hidden; }
        .btn-fb { display: none; background: #1877F2; color: white; text-decoration: none; padding: 15px; width: 100%; border-radius: 50px; text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>پی پی پی ڈیجیٹل سہراب گوٹھ</h2>
        <p>کارکن رجسٹریشن پورٹل</p>
    </div>

    <div class="card" id="formArea">
        <form id="regForm">
            <input type="text" name="name" id="name" placeholder="مکمل نام" required>
            <input type="number" name="cnic" id="cnic" placeholder="شناختی کارڈ نمبر" required>
            <input type="number" name="phone" id="phone" placeholder="واٹس ایپ نمبر" required>
            <input type="text" name="uc" id="uc" placeholder="یو سی / وارڈ" required>
            
            <p style="font-size: 14px; color: #666; margin-bottom: 0;">📱 سوشل میڈیا لنکس (لازمی):</p>
            <input type="text" name="fb" id="fb" placeholder="فیس بک آئی ڈی لنک" required>
            <input type="text" name="tiktok" id="tiktok" placeholder="ٹک ٹاک آئی ڈی" required>

            <p style="font-size: 14px; color: #666; margin-bottom: 0;">📸 اپنی تصویر منتخب کریں:</p>
            <input type="file" id="photo" accept="image/*" required>

            <div style="background:#fff3cd; padding:10px; border-radius:5px; font-size:12px; margin-top:10px;">
                <input type="checkbox" id="vow" style="width: auto;" required> میں حلفیہ اقرار کرتا ہوں کہ میں پارٹی کے نظم و ضبط کا پابند رہوں گا۔
            </div>

            <div class="sig-area"><canvas id="canvas"></canvas></div>
            <button type="button" onclick="pad.clear()" style="color:red; background:none; border:none; cursor:pointer; font-size:11px;">❌ دستخط صاف کریں</button>

            <button type="submit" class="btn-submit" id="subBtn">ریکارڈ جمع کریں اور کارڈ حاصل کریں</button>
        </form>
    </div>

    <div id="idCard">
        <div style="background:#000; color:#fff; padding:10px; text-align:center; font-weight:bold;">MEMBERSHIP CARD</div>
        <div style="display:flex; padding:15px; gap:15px;">
            <img id="uImg" style="width:100px; height:120px; border:1px solid #ddd; object-fit:cover;">
            <div style="font-size:13px; flex:1;">
                <p><strong>نام:</strong> <span id="vName"></span></p>
                <p><strong>فون:</strong> <span id="vPhone"></span></p>
                <p><strong>ID:</strong> <span id="vId"></span></p>
            </div>
            <div id="qrcode"></div>
        </div>
        <div style="padding:10px; text-align:left; border-top:1px solid #eee;">
            <img id="vSig" style="height:30px; filter: grayscale(1);">
        </div>
    </div>

    <a href="https://www.facebook.com/groups/YOUR_GROUP_ID" id="fbBtn" class="btn-fb" target="_blank">🔵 آفیشل فیس بک گروپ جوائن کریں</a>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const pad = new SignaturePad(canvas);
    const form = document.getElementById('regForm');
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyl8xZ-eY_tAK4zzM8bGkzKfIrN7xfRirv0WeKiDy9RVazj4rEYII5DKXtGxJaEcY/exec';

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        if (pad.isEmpty()) {
            alert("براہ کرم دستخط کریں!");
            return;
        }

        const btn = document.getElementById('subBtn');
        btn.innerText = "پروسیسنگ ہو رہی ہے...";
        btn.disabled = true;

        const reader = new FileReader();
        const file = document.getElementById('photo').files;
        
        reader.onload = function(event) {
            const base64Img = event.target.result;
            const data = {
                name: document.getElementById('name').value,
                cnic: document.getElementById('cnic').value,
                phone: document.getElementById('phone').value,
                uc: document.getElementById('uc').value,
                fb: document.getElementById('fb').value,
                tiktok: document.getElementById('tiktok').value,
                memberId: "SG-" + Math.floor(1000 + Math.random() * 9000)
            };

            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) })
            .then(() => {
                document.getElementById('vName').innerText = data.name;
                document.getElementById('vPhone').innerText = data.phone;
                document.getElementById('vId').innerText = data.memberId;
                document.getElementById('uImg').src = base64Img;
                document.getElementById('vSig').src = pad.toDataURL();
                
                document.getElementById('formArea').style.display = 'none';
                document.getElementById('idCard').style.display = 'block';
                document.getElementById('fbBtn').style.display = 'block';
                
                new QRCode(document.getElementById("qrcode"), { text: data.memberId, width: 60, height: 60 });
                alert("آپ کا ریکارڈ محفوظ کر لیا گیا ہے!");
            })
            .catch(error => {
                alert("کنکشن کا مسئلہ ہے، لیکن کارڈ تیار ہے۔");
                btn.disabled = false;
            });
        };
        reader.readAsDataURL(file);
    });
</script>

</body>
</html>
