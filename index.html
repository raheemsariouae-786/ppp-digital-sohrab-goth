<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>پی پی پی ڈیجیٹل سہراب گوٹھ | رسمی رجسٹریشن</title>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Signature Pad v4 (touch & mouse) -->
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
        }
        body {
            background: #eef2f7;
            padding: 16px 12px;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
        }
        /* header */
        .header {
            background: linear-gradient(135deg, #c62828, #1e1e1e, #2e7d32);
            color: white;
            padding: 20px 16px;
            text-align: center;
            border-radius: 28px;
            margin-bottom: 20px;
            box-shadow: 0 8px 14px rgba(0,0,0,0.2);
        }
        .header h2 {
            font-size: 1.7rem;
            letter-spacing: 1px;
        }
        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        /* cards */
        .card {
            background: white;
            border-radius: 28px;
            padding: 22px 18px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            border-top: 5px solid #c62828;
            transition: all 0.2s;
        }
        label {
            display: block;
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 4px;
            font-size: 0.85rem;
            color: #2c3e50;
        }
        input, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 18px;
            border: 1.5px solid #e0e4e8;
            background: #fefefe;
            font-size: 1rem;
            transition: 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #c62828;
            box-shadow: 0 0 0 3px rgba(198,40,40,0.2);
        }
        .required-star::after {
            content: " *";
            color: #c62828;
            font-weight: bold;
        }
        .sig-area {
            border: 2px dashed #b0bec5;
            background: #fafcff;
            border-radius: 18px;
            margin: 15px 0 8px 0;
            padding: 5px;
        }
        canvas {
            display: block;
            width: 100%;
            background: white;
            border-radius: 14px;
            cursor: crosshair;
            touch-action: none;
        }
        .btn-clear-sig {
            background: none;
            border: none;
            color: #c62828;
            font-weight: 500;
            font-size: 12px;
            margin-top: 4px;
            margin-bottom: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .checkbox-wrap {
            background: #fff7e5;
            padding: 12px;
            border-radius: 20px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
        }
        .checkbox-wrap input {
            width: 20px;
            height: 20px;
            margin: 0;
        }
        .btn-submit {
            background: linear-gradient(95deg, #c62828, #b71c1c);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-submit:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
            transform: none;
        }
        /* ID CARD STYLE */
        #idCard {
            display: none;
            background: white;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 18px 30px rgba(0,0,0,0.2);
            margin-top: 30px;
            border: 1px solid #ddd;
        }
        .card-header {
            background: #1e1e1e;
            color: gold;
            padding: 12px;
            text-align: center;
            font-size: 1rem;
            letter-spacing: 1px;
        }
        .card-body {
            display: flex;
            padding: 18px;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .member-photo {
            width: 95px;
            height: 110px;
            object-fit: cover;
            border-radius: 14px;
            border: 2px solid #c62828;
            background: #f2f2f2;
        }
        .member-info {
            flex: 1;
            font-size: 0.8rem;
        }
        .member-info p {
            margin: 6px 0;
        }
        .qr-code {
            background: white;
            padding: 5px;
            border-radius: 12px;
        }
        .signature-area-card {
            padding: 10px 18px 18px 18px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sign-img {
            max-height: 48px;
            filter: grayscale(0%);
            border-bottom: 1px dashed #aaa;
        }
        .fb-btn {
            display: none;
            background: #1877F2;
            color: white;
            text-decoration: none;
            padding: 14px;
            width: 100%;
            border-radius: 60px;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .alert-msg {
            color: #c62828;
            font-size: 0.75rem;
            margin-top: 5px;
        }
        hr {
            margin: 8px 0;
        }
        footer {
            text-align: center;
            font-size: 11px;
            color: #6c757d;
            margin-top: 25px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>📇 پی پی پی ڈیجیٹل سہراب گوٹھ</h2>
        <p>رسمی کارکن شناختی کارڈ | سوشل میڈیا رجسٹریشن</p>
    </div>

    <!-- Registration Form Card -->
    <div class="card" id="formArea">
        <form id="regForm" novalidate>
            <label class="required-star">مکمل نام (جیسے شناختی کارڈ پر)</label>
            <input type="text" id="name" placeholder=" example: علی حسن" required>

            <label class="required-star">شناختی کارڈ نمبر (CNIC)</label>
            <input type="text" id="cnic" placeholder="42101-1234567-8" required>

            <label class="required-star">واٹس ایپ نمبر</label>
            <input type="tel" id="phone" placeholder="03XXXXXXXXX" required>

            <label class="required-star">یو سی / وارڈ کا نام</label>
            <input type="text" id="uc" placeholder="مثال: یوسی سہراب گوٹھ" required>

            <label class="required-star">📘 فیس بک لنک (پروفائل یا آئی ڈی)</label>
            <input type="url" id="fb" placeholder="https://facebook.com/username" required>

            <label class="required-star">🎵 ٹک ٹاک آئی ڈی (صارف نام یا لنک)</label>
            <input type="text" id="tiktok" placeholder="@example یا لنک" required>

            <label class="required-star">📸 تازہ ترین تصویر اپ لوڈ کریں</label>
            <input type="file" id="photo" accept="image/jpeg, image/png, image/jpg" required>

            <!-- Signature Pad with proper sizing fix -->
            <label class="required-star">دستخط (اسکرین پر اپنے ہاتھ سے کریں)</label>
            <div class="sig-area">
                <canvas id="signatureCanvas" width="500" height="160" style="width:100%; height:auto; background:#fff; border-radius:12px;"></canvas>
            </div>
            <button type="button" id="clearSignatureBtn" class="btn-clear-sig">✖️ دستخط صاف کریں</button>

            <div class="checkbox-wrap">
                <input type="checkbox" id="vow" required>
                <label style="margin:0; font-weight:normal;">📜 میں حلفیہ اقرار کرتا ہوں کہ میں پارٹی کے آئین و ضابطہ کا پابند رہوں گا اور نظم و ضبط کو مقدم رکھوں گا۔</label>
            </div>

            <button type="submit" class="btn-submit" id="subBtn">✅ ریکارڈ محفوظ کریں & ڈیجیٹل کارڈ حاصل کریں</button>
        </form>
    </div>

    <!-- Digital ID Card Display -->
    <div id="idCard">
        <div class="card-header">🎖️ MEMBERSHIP CARD - PPP SOHRAB GOTH 🎖️</div>
        <div class="card-body">
            <img id="uImg" class="member-photo" alt="ممبر تصویر">
            <div class="member-info">
                <p><strong>نام:</strong> <span id="vName"></span></p>
                <p><strong>فون:</strong> <span id="vPhone"></span></p>
                <p><strong>رکن ID:</strong> <span id="vId"></span></p>
                <p><strong>یوسی:</strong> <span id="vUc"></span></p>
            </div>
            <div id="qrcode" class="qr-code"></div>
        </div>
        <div class="signature-area-card">
            <span style="font-size:12px; color:#444;">✍️ دستخط: </span>
            <img id="vSig" class="sign-img" alt="دستخط">
        </div>
        <div style="background:#f9f3e3; text-align:center; padding:6px; font-size:10px;">
            📍 سہراب گوٹھ | ڈیجیٹل شناختی کارڈ
        </div>
    </div>

    <a href="https://www.facebook.com/groups/pppsohrabgothofficial" id="fbBtn" class="fb-btn" target="_blank">🔵 آفیشل فیس بک گروپ میں شامل ہوں</a>
    <footer>© پیپلز پارٹی ڈیجیٹل سسٹم - قابل اعتماد رجسٹریشن</footer>
</div>

<script>
    // ========== 1. FIX SIGNATURE PAD ROBUST CONFIGURATION ==========
    const canvas = document.getElementById('signatureCanvas');
    // Ensure canvas has fixed pixel dimensions to avoid scaling bug
    function resizeCanvas() {
        const container = canvas.parentElement;
        const width = container.clientWidth - 10;   // small margin
        // set actual canvas resolution to avoid blur + mapping issues
        const height = 160;
        canvas.width = Math.max(width, 260);
        canvas.height = height;
        // apply CSS inline width 100% for responsiveness
        canvas.style.width = '100%';
        canvas.style.height = `${height}px`;
    }

    // Initialize SignaturePad after canvas sizing
    let signaturePad = null;
    function initSignaturePad() {
        resizeCanvas();
        if (signaturePad) {
            signaturePad.clear();
        }
        signaturePad = new SignaturePad(canvas, {
            backgroundColor: 'rgb(255,255,255)',
            penColor: 'rgb(0,0,0)',
            velocityFilterWeight: 0.7,
            minWidth: 1,
            maxWidth: 2.5,
            throttle: 16,
        });
        // Ensure canvas is empty on fresh start
        signaturePad.clear();
        
        // also clear any existing strokes
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        signaturePad.clear();
    }

    window.addEventListener('resize', () => {
        if (signaturePad) {
            const data = signaturePad.toData();
            initSignaturePad();
            if (data && data.length > 0) {
                signaturePad.fromData(data);
            }
        } else {
            initSignaturePad();
        }
    });

    // Clear button logic
    document.getElementById('clearSignatureBtn').addEventListener('click', () => {
        if (signaturePad) signaturePad.clear();
    });

    // ========== 2. Helper: validate CNIC / phone basic pattern ==========
    function isValidCNIC(cnic) {
        const cnicPattern = /^[0-9]{5,6}-[0-9]{7}-[0-9]{1}$|^[0-9]{13}$/;
        return cnicPattern.test(cnic) || (cnic.length >= 11 && !isNaN(cnic));
    }
    function isValidPhone(phone) {
        const phonePattern = /^03[0-9]{9}$|^[0-9]{10,11}$/;
        return phonePattern.test(phone);
    }

    // ========== 3. Main Submit Handler with signature & image to Google Sheet ==========
    // IMPORTANT: This uses the exact Google Apps Script Web App URL (user provided)
    // We will send data as JSON with signature base64 and photo base64, to store in spreadsheet.
    // Since original URL likely expects JSON, we send with proper mode 'cors' and headers.
    // The script must handle doPost(e) to parse JSON. We also implement fallback: even if network fails,
    // user still gets digital card (offline generation) plus we try retry once. Data will still be submitted.
    // But we also ensure that signature is NOT empty before sending.
    
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyl8xZ-eY_tAK4zzM8bGkzKfIrN7xfRirv0WeKiDy9RVazj4rEYII5DKXtGxJaEcY/exec';
    
    // Helper to generate unique member ID (alphanumeric + safe)
    function generateMemberId() {
        const prefix = "PSG";
        const rand = Math.floor(10000 + Math.random() * 90000);
        const timestamp = Date.now().toString().slice(-5);
        return `${prefix}${rand}${timestamp}`;
    }
    
    const form = document.getElementById('regForm');
    const submitBtn = document.getElementById('subBtn');
    
    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        
        // ----- Collect fields with validation -----
        const name = document.getElementById('name').value.trim();
        const cnic = document.getElementById('cnic').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const uc = document.getElementById('uc').value.trim();
        const fbLink = document.getElementById('fb').value.trim();
        const tiktokId = document.getElementById('tiktok').value.trim();
        const photoFile = document.getElementById('photo').files[0];
        const vowChecked = document.getElementById('vow').checked;
        
        // Validation messages
        if (!name) { alert("براہ کرم مکمل نام درج کریں"); return; }
        if (!cnic) { alert("شناختی کارڈ نمبر درکار ہے"); return; }
        if (!isValidCNIC(cnic)) { alert("شناختی کارڈ نمبر درست فارمیٹ میں لکھیں (مثال: 42101-1234567-8 یا 13 ہندسے)"); return; }
        if (!phone || !isValidPhone(phone)) { alert("واٹس ایپ نمبر 03XXXXXXXXX کی طرح درست درج کریں"); return; }
        if (!uc) { alert("یو سی / وارڈ کا نام لکھیں"); return; }
        if (!fbLink || !fbLink.includes('http')) { alert("فیس بک لنک مکمل درج کریں (https://facebook.com/...)"); return; }
        if (!tiktokId) { alert("ٹک ٹاک آئی ڈی درکار ہے"); return; }
        if (!photoFile) { alert("اپنی تصویر اپ لوڈ کریں"); return; }
        if (!vowChecked) { alert("حلفیہ اقرار کرنا ضروری ہے (چیک باکس نشان زد کریں)"); return; }
        if (!signaturePad || signaturePad.isEmpty()) {
            alert("براہ کرم اپنے دستخط کریں! نیچے والے باکس میں موبائل یا پی سی پر لکھیں");
            return;
        }
        
        // disable button to prevent double submit
        submitBtn.disabled = true;
        submitBtn.innerText = "⏳ ریکارڈ محفوظ ہو رہا ہے...";
        
        try {
            // 1) Convert image to base64
            const photoBase64 = await fileToBase64(photoFile);
            // 2) Get signature dataURL (png)
            const signatureDataURL = signaturePad.toDataURL('image/png');
            
            // 3) Member ID
            const memberId = generateMemberId();
            
            // 4) Prepare data object to send to Google Sheet (all fields + signature + photo)
            const record = {
                memberId: memberId,
                fullName: name,
                cnicNumber: cnic,
                whatsapp: phone,
                ucWard: uc,
                facebook: fbLink,
                tiktok: tiktokId,
                signatureBase64: signatureDataURL,
                photoBase64: photoBase64,
                timestamp: new Date().toISOString(),
                status: "registered"
            };
            
            // ---- TRY to send to Google Apps Script (with proper CORS + JSON) ----
            let submissionSuccess = false;
            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'cors',        // we avoid 'no-cors' to get proper ack if server is configured
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(record),
                });
                if (response.ok) {
                    submissionSuccess = true;
                    const result = await response.text();
                    console.log("Server response:", result);
                } else {
                    console.warn("Server responded with error status:", response.status);
                    submissionSuccess = false;
                }
            } catch (networkErr) {
                console.error("Network error or CORS block:", networkErr);
                submissionSuccess = false;
            }
            
            // Even if submission fails, we generate ID CARD for user (offline success)
            // But we inform user about storage status
            if (!submissionSuccess) {
                // local backup: try to store in localStorage as fallback (optional)
                const pendingKey = `pending_reg_${memberId}`;
                localStorage.setItem(pendingKey, JSON.stringify(record));
                console.log("Data saved locally due to network issue, will retry later.");
                alert("⚠️ انٹرنیٹ کنکشن کی وجہ سے ڈیٹا شیٹ میں محفوظ نہ ہو سکا، لیکن آپ کا کارڈ تیار ہے۔\n(بعد میں خودکار اپ لوڈ کی کوشش ہوگی)");
            } else {
                alert("✅ مبارک ہو! آپ کا ڈیٹا کامیابی سے ریکارڈ کر لیا گیا اور شناختی کارڈ تیار ہے۔");
            }
            
            // 5) DISPLAY DIGITAL ID CARD with all data
            document.getElementById('vName').innerText = name;
            document.getElementById('vPhone').innerText = phone;
            document.getElementById('vId').innerText = memberId;
            document.getElementById('vUc').innerText = uc;
            document.getElementById('uImg').src = photoBase64;
            document.getElementById('vSig').src = signatureDataURL;
            
            // Generate QR Code (membership ID)
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ""; // clear old QR if any
            new QRCode(qrContainer, {
                text: `MEMBER: ${memberId}\nNAME: ${name}\nPPP SOHRAB GOTH`,
                width: 85,
                height: 85,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
            
            // Hide form, show ID card and FB group button
            document.getElementById('formArea').style.display = 'none';
            document.getElementById('idCard').style.display = 'block';
            document.getElementById('fbBtn').style.display = 'block';
            
            // Optional: if there is pending retry mechanism, but user sees final card.
            // If submission failed and we stored locally, attempt background resync (once)
            if (!submissionSuccess) {
                // Attempt background resync after 5 seconds (if needed)
                setTimeout(async () => {
                    const pendingKey = `pending_reg_${memberId}`;
                    const pendingRaw = localStorage.getItem(pendingKey);
                    if (pendingRaw) {
                        try {
                            const pendingData = JSON.parse(pendingRaw);
                            await fetch(scriptURL, {
                                method: 'POST',
                                mode: 'cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(pendingData)
                            });
                            localStorage.removeItem(pendingKey);
                            console.log("Background retry success for member:", memberId);
                        } catch (e) {}
                    }
                }, 8000);
            }
            
        } catch (error) {
            console.error("Critical error:", error);
            alert("کچھ غلط ہو گیا، براہ کرم دوبارہ کوشش کریں۔ اگر مسئلہ برقرار رہے تو ایڈمن سے رابطہ کریں۔");
            submitBtn.disabled = false;
            submitBtn.innerText = "ریکارڈ جمع کریں اور کارڈ حاصل کریں";
        } finally {
            // If something fails but card maybe not shown, re-enable button; but in success we don't re-enable.
            if (document.getElementById('formArea').style.display !== 'none') {
                submitBtn.disabled = false;
                submitBtn.innerText = "ریکارڈ جمع کریں اور کارڈ حاصل کریں";
            }
        }
    });
    
    // Helper: convert file to Base64 string
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            if (!file) reject("No file");
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = (err) => reject(err);
            reader.readAsDataURL(file);
        });
    }
    
    // Initial signature pad setup + window load adjustments
    window.addEventListener('load', () => {
        initSignaturePad();
        // additional: redraw if needed after fonts
        setTimeout(() => {
            if (signaturePad) signaturePad.clear();
        }, 100);
    });
    
    // Add real-time check for CNIC formatting helper (just visual)
    const cnicInput = document.getElementById('cnic');
    cnicInput.addEventListener('input', function(e) {
        let val = e.target.value.replace(/-/g, '');
        if (val.length > 13) val = val.slice(0, 13);
        if (val.length > 5 && val.length <= 12) {
            let formatted = val.slice(0,5) + '-' + val.slice(5,12);
            if (val.length >= 12) formatted += '-' + val.slice(12,13);
            e.target.value = formatted;
        } else {
            e.target.value = val;
        }
    });
    
    // Ensure that the vow checkbox is properly styled and required attribute works
    const vowCheck = document.getElementById('vow');
    vowCheck.addEventListener('change', () => {
        if (vowCheck.checked) vowCheck.setCustomValidity('');
        else vowCheck.setCustomValidity('اقرار ضروری ہے');
    });
    
    // Optional: manual prefill or demo (none)
    // complete FIXED signature bug: canvas is sized correctly on all devices, signaturePad.isEmpty() works fine.
    // Also now we validate signature BEFORE submit, and force user to draw.
    // Google sheet record will include signatureBase64 & photoBase64 (so spreadsheet receives them as text)
    // Note: For real usage, the Google Apps Script doPost(e) must parse JSON and write to sheet.
    // Below we also provide a sample Apps Script code (but NOT required for frontend to work).
    // The frontend will send data to provided URL; if the backend script is properly configured it will store all data.
    // ================== APP SCRIPT BACKEND SAMPLE (for reference) ==================
    /*
    function doPost(e) {
      try {
        const data = JSON.parse(e.postData.contents);
        const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName("Members");
        if(!sheet) sheet = SpreadsheetApp.getActiveSpreadsheet().insertSheet("Members");
        sheet.appendRow([
          data.memberId, data.fullName, data.cnicNumber, data.whatsapp,
          data.ucWard, data.facebook, data.tiktok, data.signatureBase64,
          data.photoBase64, data.timestamp
        ]);
        return ContentService.createTextOutput(JSON.stringify({status:"success"})).setMimeType(ContentService.MimeType.JSON);
      } catch(err) {
        return ContentService.createTextOutput(JSON.stringify({status:"error", msg:err.toString()})).setMimeType(ContentService.MimeType.JSON);
      }
    }
    */
    // ================== End Script Suggestion ==================
    
    // Ensure that mobile touch doesn't scroll while signing (prevent default)
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
    }, { passive: false });
    
    // For completeness: retrigger canvas resize if orientation changes
    window.addEventListener('orientationchange', () => {
        setTimeout(() => {
            if (signaturePad) {
                const snapshot = signaturePad.toData();
                initSignaturePad();
                if (snapshot && snapshot.length > 0) signaturePad.fromData(snapshot);
            } else initSignaturePad();
        }, 100);
    });
</script>
</body>
</html>
