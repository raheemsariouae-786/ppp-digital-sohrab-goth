<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پی پی پی ڈیجیٹل سہراب گوٹھ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        :root { --red: #d32f2f; --black: #000000; --green: #2e7d32; }
        body { font-family: 'Segoe UI', Tahoma, Arial; background: #f4f4f9; direction: rtl; margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; }
        .header { background: linear-gradient(to right, var(--red), var(--black), var(--green)); color: white; padding: 25px; text-align: center; border-radius: 0 0 20px 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 20px; border-top: 4px solid var(--red); }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn-main { background: var(--black); color: white; border: 2px solid var(--red); padding: 15px; width: 100%; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 18px; margin-top: 20px; }
        #idCard { display: none; background: white; border: 3px solid var(--black); border-radius: 15px; overflow: hidden; margin-top: 25px; }
        .card-head { background: linear-gradient(to left, var(--red), var(--black), var(--green)); color: white; padding: 15px; text-align: center; }
        .card-body { display: flex; padding: 15px; gap: 15px; align-items: center; }
        .member-img { width: 100px; height: 120px; border: 2px solid #ddd; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>پی پی پی ڈیجیٹل سہراب گوٹھ</h1>
        <p>عوامی خدمت اور ڈیجیٹل محاذ کی آواز</p>
    </div>

    <div class="card">
        <h3>📝 ممبر رجسٹریشن</h3>
        <input type="text" id="name" placeholder="نام">
        <input type="number" id="phone" placeholder="واٹس ایپ نمبر">
        <textarea id="address" placeholder="علاقہ / پتہ"></textarea>
        <input type="file" id="photoFile" accept="image/*" onchange="previewImg(event)">
        
        <label>دستخط کریں:</label>
        <div style="border:1px solid #ccc; background:#fff; margin-top:5px;">
            <canvas id="canvas" style="width:100%; height:100px;"></canvas>
        </div>

        <button class="btn-main" id="submitBtn" onclick="generate()">ڈیجیٹل کارڈ اور ریکارڈ جمع کریں</button>
    </div>

    <div id="idCard">
        <div class="card-head"><h4>پی پی پی ڈیجیٹل سہراب گوٹھ</h4></div>
        <div class="card-body">
            <img id="outPhoto" class="member-img">
            <div style="flex:1; font-size: 14px;">
                <p><strong>نام:</strong> <span id="outName"></span></p>
                <p><strong>آئی ڈی:</strong> <span id="outId"></span></p>
            </div>
            <div id="qr"></div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const pad = new SignaturePad(canvas);
    let photoData = "";
    // آپ کا ویب ایپ یو آر ایل
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyl8xZ-eY_tAK4zzM8bGkzKfIrN7xfRirv0WeKiDy9RVazj4rEYII5DKXtGxJaEcY/exec';

    function previewImg(e) {
        const reader = new FileReader();
        reader.onload = () => { photoData = reader.result; };
        reader.readAsDataURL(e.target.files);
    }

    async function generate() {
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const address = document.getElementById('address').value;
        const memberId = "SG-" + Math.floor(1000 + Math.random() * 9000);
        const btn = document.getElementById('submitBtn');

        if(!name || !phone || !photoData) {
            alert("براہ کرم تمام خانے پُر کریں۔");
            return;
        }

        btn.innerText = "جمع ہو رہا ہے...";
        btn.disabled = true;

        const data = { name, phone, address, memberId };

        try {
            // گوگل شیٹ میں ڈیٹا بھیجنا
            await fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(data)
            });

            // کارڈ دکھانا
            document.getElementById('outName').innerText = name;
            document.getElementById('outId').innerText = memberId;
            document.getElementById('outPhoto').src = photoData;
            document.getElementById('idCard').style.display = 'block';
            new QRCode(document.getElementById("qr"), { text: memberId, width: 60, height: 60 });

            alert("مبارک ہو! ریکارڈ شیٹ میں جمع ہو گیا ہے اور کارڈ تیار ہے۔");
            
            // واٹس ایپ اطلاع
            const waMsg = `*نئی رجسٹریشن*\nنام: ${name}\nفون: ${phone}\nآئی ڈی: ${memberId}`;
            window.open(`https://wa.me/923112221014?text=${encodeURIComponent(waMsg)}`, '_blank');

        } catch (error) {
            console.error('Error!', error.message);
            alert("ڈیٹا جمع کرنے میں مسئلہ آیا، لیکن کارڈ بن گیا ہے۔");
        }
        
        btn.innerText = "ڈیجیٹل کارڈ اور ریکارڈ جمع کریں";
        btn.disabled = false;
    }
</script>

</body>
</html>
